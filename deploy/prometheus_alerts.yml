groups:
  - name: shitposter
    interval: 60s
    rules:

      # ── Pipeline health ───────────────────────────────────────────────────

      - alert: PipelineSilent
        expr: rate(shitposter_events_ingested_total[15m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No events ingested in last 10 minutes"
          description: "All ingestors may be down. Check /healthz and logs."

      - alert: NoPublicationsIn1h
        expr: rate(shitposter_events_published_total[1h]) == 0
        for: 60m
        labels:
          severity: warning
        annotations:
          summary: "No events published in last hour"
          description: "Pipeline may be stuck at verify/compose/publish stage."

      - alert: HighDropRate
        expr: |
          rate(shitposter_events_dropped_total[30m])
          / (rate(shitposter_events_clustered_total[30m]) + 0.001) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Drop rate > 90% over 30 minutes"
          description: "Stage: {{ $labels.stage }}, reason: {{ $labels.reason }}"

      # ── Hallucination guard ───────────────────────────────────────────────

      - alert: HallucinationSpike
        expr: rate(shitposter_hallucinations_caught_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hallucination judge catching > 5 drafts/hour"
          description: "LLM may be drifting. Check model or prompt changes."

      # ── X budget ─────────────────────────────────────────────────────────

      - alert: XBudgetLow
        expr: shitposter_x_write_budget_remaining < 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "X write budget almost exhausted ({{ $value }} remaining)"
          description: "Less than 5 X posts left this month."

      - alert: XBudgetExhausted
        expr: shitposter_x_write_budget_remaining == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "X write budget exhausted"
          description: "No more X posts this calendar month."

      # ── Latency SLOs ─────────────────────────────────────────────────────

      - alert: PublishLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(shitposter_pipeline_latency_seconds_bucket[10m])) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 publish latency > 5 minutes"
          description: "p95={{ $value }}s. Breaking news value is decaying."
