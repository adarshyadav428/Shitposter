[project]
name = "autonomous-news-broadcaster"
version = "0.1.0"
description = "Autonomous, low-latency, multi-source breaking news broadcaster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10.11",
  "feedparser>=6.0.11",
  "fastapi>=0.115.5",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.1",
  "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
