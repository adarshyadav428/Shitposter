[project]
name = "shitposter"
version = "0.1.0"
description = "Autonomous breaking-news broadcasting pipeline for geopolitics, macro, and crypto."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "websockets>=13.1",
    "anthropic>=0.39",
    "spacy>=3.8",
    "simhash>=2.1",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "telethon>=1.37",
    "atproto>=0.0.55",
    "Mastodon.py>=1.8",
    "tweepy>=4.14",
    "beautifulsoup4>=4.12",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
