name: Deploy Self-Hosted

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (latest, sha-..., or release tag)
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            CANDIDATE_IMAGE="ghcr.io/${{ github.repository_owner }}/autonomous-news-broadcaster:${{ inputs.image_tag }}"
            LAST_GOOD_FILE=".last_successful_image"
            PREVIOUS_IMAGE=""
            if [ -f "$LAST_GOOD_FILE" ]; then
              PREVIOUS_IMAGE="$(cat \"$LAST_GOOD_FILE\")"
            fi

            export NEWSBOT_IMAGE="$CANDIDATE_IMAGE"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            READY=0
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/health/ready > /tmp/newsbot-ready.json; then
                READY=1
                break
              fi
              sleep 4
            done

            if [ "$READY" -eq 1 ]; then
              printf '%s' "$CANDIDATE_IMAGE" > "$LAST_GOOD_FILE"
              cat /tmp/newsbot-ready.json
              exit 0
            fi

            echo "Readiness check failed for candidate image: $CANDIDATE_IMAGE"
            if [ -n "$PREVIOUS_IMAGE" ] && [ "$PREVIOUS_IMAGE" != "$CANDIDATE_IMAGE" ]; then
              echo "Rolling back to previous known-good image: $PREVIOUS_IMAGE"
              export NEWSBOT_IMAGE="$PREVIOUS_IMAGE"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              curl -fsS --retry 8 --retry-delay 3 --max-time 5 http://127.0.0.1:8000/health/ready > /tmp/newsbot-ready-rollback.json
              echo "Rollback readiness payload:"
              cat /tmp/newsbot-ready-rollback.json
            else
              echo "No previous known-good image available for rollback."
            fi
            exit 1
