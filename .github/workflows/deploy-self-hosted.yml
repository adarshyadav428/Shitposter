name: Deploy Self-Hosted

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (latest, sha-..., or release tag)
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            export NEWSBOT_IMAGE="ghcr.io/${{ github.repository_owner }}/autonomous-news-broadcaster:${{ inputs.image_tag }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            curl -fsS http://127.0.0.1:8000/health/ready > /tmp/newsbot-ready.json
            cat /tmp/newsbot-ready.json
