services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

  app:
    image: ${NEWSBOT_IMAGE:-ghcr.io/owner/autonomous-news-broadcaster:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      STATE_SNAPSHOT_PATH: /app/.state/newsbot_state.json
      STATE_SQLITE_PATH: /app/.state/newsbot_state.sqlite
      USE_MOCK_INGESTORS: "false"
      ENABLE_REAL_RSS: "true"
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./state:/app/.state
